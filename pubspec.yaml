name: hamsafar
description: "HamSafar — intercity ride-sharing app (Flutter port)."
publish_to: 'none'

version: 1.1.0+12

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1
  flutter_riverpod: ^3.3.1
  image_picker: ^1.1.2
  intl: ^0.20.2
  shared_preferences: ^2.3.3
  supabase_flutter: ^2.12.4
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/brand/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
          weight: 400
        - asset: assets/fonts/Manrope.ttf
          weight: 500
        - asset: assets/fonts/Manrope.ttf
          weight: 600
        - asset: assets/fonts/Manrope.ttf
          weight: 700

# Generate Android + iOS launcher icons from one source.
# Run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/brand/icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/brand/icon_foreground.png"

# Native splash matches `LaunchSplash` *exactly*: dark-navy background, no
# image. The animated Flutter splash takes over the instant the engine boots
# — same colour, so there is zero visual jump between native and Flutter.
# Run: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0D1421"
  color_dark: "#0D1421"
  android_12:
    color: "#0D1421"
    color_dark: "#0D1421"
